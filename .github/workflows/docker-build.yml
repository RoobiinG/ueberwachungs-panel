name: Docker Image bauen & pushen

# Zwei Ziele, zwei Tags:
#   Branch `test`   → ghcr.io/…:test    — läuft auf dem Testserver
#   Branch `master` → ghcr.io/…:latest  — läuft produktiv
# Neue Funktionen und Fehlerbehebungen gehen immer zuerst nach `test`; erst wenn sie dort
# geprüft sind, werden sie nach `master` übernommen.
on:
  push:
    branches: [main, master, test]
  workflow_dispatch:

# Immer nur ein Image-Build gleichzeitig pro Branch. Zwei parallele Läufe schieben sonst
# denselben `latest`-Tag zeitgleich zu ghcr.io, was dort zu "ERROR: unknown blob" führen kann.
# cancel-in-progress bleibt aus: Der laufende Build soll fertig werden, der neue wartet.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Bei GitHub Container Registry einloggen
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/roobiing/ueberwachungs-panel
          # `latest` bekommt ausschließlich master — sonst würde ein Test-Build den
          # produktiven Tag überschreiben und ungeprüfter Code liefe auf dem echten Server.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=sha,prefix=,format=short

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Ohne Provenance-Attestierung entsteht ein einfacher Image-Index statt eines
          # zusätzlichen Attestation-Manifests — das reduziert die Blob-Uploads und damit
          # die Angriffsfläche für den sporadischen "unknown blob"-Fehler von ghcr.io.
          # Das Panel nutzt die Attestierung nirgends.
          provenance: false
