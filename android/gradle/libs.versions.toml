[versions]
agp = "9.2.1"
kotlin = "2.2.10"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
lifecycle = "2.8.3"
navigation = "2.7.7"
retrofit = "2.11.0"
okhttp = "4.12.0"
coroutines = "1.8.1"
gson = "2.11.0"
glide = "4.16.0"
workmanager = "2.9.0"
datastore = "1.1.1"
mpandroidchart = "v3.1.0"
swiperefreshlayout = "1.1.0"
securityCrypto = "1.1.0"
biometric = "1.2.0-alpha05"
